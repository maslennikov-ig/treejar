name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.codex/**'
      - '.beads/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.codex/**'
      - '.beads/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.classify.outputs.deploy }}
      semantic: ${{ steps.classify.outputs.semantic }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail

          emit() {
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            echo "semantic=$2" >> "$GITHUB_OUTPUT"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            emit true true
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            emit true true
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          printf '%s\n' "$changed_files"

          deploy=false
          semantic=false

          if printf '%s\n' "$changed_files" | grep -Eq '^(src/|frontend/|migrations/|alembic\.ini$|pyproject\.toml$|uv\.lock$|Dockerfile$|docker-compose(\..+)?\.ya?ml$|scripts/vps-deploy\.sh$)'; then
            deploy=true
          fi

          # tj-qfsy. The producer and the production search path it must keep
          # using, plus the two files that decide what "the pinned model" and
          # "the job" mean.
          if printf '%s\n' "$changed_files" | grep -Eq '^(scripts/corpus_bridge/|src/rag/|tests/test_corpus_bridge_semantic_catalog_evidence\.py$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            semantic=true
          fi

          emit "$deploy" "$semantic"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.6"
          enable-cache: true
          save-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.6"
          enable-cache: true
          save-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Mypy
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      APP_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.6"
          enable-cache: true
          save-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/admin/package-lock.json"
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Install admin frontend dependencies
        run: npm ci --prefix frontend/admin
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # tj-qfsy. `test_producer_runs_pinned_bge_through_real_exact_pgvector_search`
  # is the only test that exercises the central tj-rcg5 claim: the producer
  # goes through `src.rag.pipeline.search_products` on real exact pgvector, with
  # no ANN index and no database residue. It skips itself whenever
  # SEMANTIC_EVIDENCE_DATABASE_URL is unset, so until now it never ran anywhere
  # except by hand. Kept out of `deploy`'s needs on purpose: this guards the
  # measured-round harness, not the runtime, and a model download must not sit
  # between a runtime fix and production.
  semantic-evidence:
    needs: [changes]
    if: needs.changes.outputs.semantic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: treejar_semantic_evidence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SEMANTIC_EVIDENCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/treejar_semantic_evidence_ci
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.6"
          enable-cache: true
          save-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      # The BGE-M3 download dominates the runtime and the revision is pinned,
      # so the cache key is the revision itself: a new pin is a new download.
      - name: Cache the pinned embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: bge-m3-5617a9f61b028005a4858fdac845db406aefb181
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      # `PinnedEmbeddingEngine` builds the model with `local_files_only=True`:
      # the pinned revision is offline by design and never fetches anything, so
      # the model has to be in `HF_HOME` before the test runs. A cache hit makes
      # this a no-op. The file list is the one the loader actually reads --
      # `onnx/` is excluded and the suite passes without it -- so a run costs
      # 2.2GB once rather than the whole repository every time.
      - name: Fetch the pinned embedding model
        run: |
          set -euo pipefail
          uv run hf download BAAI/bge-m3 \
            --revision 5617a9f61b028005a4858fdac845db406aefb181 \
            --include \
              '1_Pooling/*' \
              'colbert_linear.pt' \
              'config.json' \
              'config_sentence_transformers.json' \
              'modules.json' \
              'pytorch_model.bin' \
              'sentence_bert_config.json' \
              'sentencepiece.bpe.model' \
              'sparse_linear.pt' \
              'special_tokens_map.json' \
              'tokenizer.json' \
              'tokenizer_config.json'
      - name: Run the pgvector retrieval integration test
        run: |
          set -euo pipefail
          uv run pytest \
            "tests/test_corpus_bridge_semantic_catalog_evidence.py::test_producer_runs_pinned_bge_through_real_exact_pgvector_search" \
            -v --tb=short | tee /tmp/semantic-evidence.log
          # The test skips itself when the database URL is missing, and a skip
          # exits zero. Read the outcome, not the exit code, or this job goes
          # green on exactly the state it exists to catch.
          grep -q "1 passed" /tmp/semantic-evidence.log

  deploy:
    needs: [changes, lint, type-check, test]
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.changes.outputs.deploy == 'true') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /tmp/treejar-deploy-${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: "2222"
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Package release artifact
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=tar HEAD | tar -x -C release
          printf '%s\n' "$GITHUB_SHA" > release/.release-sha
          printf '%s\n' "$GITHUB_RUN_ID" > release/.release-run-id
          tar -czf treejar-release.tar.gz -C release .
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_treejar_vps
          chmod 600 ~/.ssh/id_treejar_vps
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload release bundle
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_treejar_vps -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "rm -rf '$DEPLOY_DIR' && mkdir -p '$DEPLOY_DIR/scripts'"
          scp -i ~/.ssh/id_treejar_vps -P "$VPS_PORT" treejar-release.tar.gz "$VPS_USERNAME@$VPS_HOST:$DEPLOY_DIR/treejar-release.tar.gz"
          scp -i ~/.ssh/id_treejar_vps -P "$VPS_PORT" scripts/vps-deploy.sh "$VPS_USERNAME@$VPS_HOST:$DEPLOY_DIR/scripts/vps-deploy.sh"
      - name: Deploy release on VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_treejar_vps -p "$VPS_PORT" "$VPS_USERNAME@$VPS_HOST" "
            chmod +x '$DEPLOY_DIR/scripts/vps-deploy.sh' &&
            '$DEPLOY_DIR/scripts/vps-deploy.sh' \
              --archive '$DEPLOY_DIR/treejar-release.tar.gz' \
              --target-dir '/opt/noor' \
              --health-url 'http://127.0.0.1:8002/api/v1/health' \
              --app-only &&
            rm -rf '$DEPLOY_DIR'
          "
